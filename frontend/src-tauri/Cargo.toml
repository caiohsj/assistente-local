[package]
name = "mestre"
version = "0.4.0"
description = "Mestre - janela flutuante e bandeja do sistema"
authors = ["Mestre"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "mestre_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "linux")'.dependencies]
# Versão igual à que o wry já usa: precisa ser o mesmo crate para o cast.
webkit2gtk = { version = "=2.0.2", features = ["v2_22"] }
